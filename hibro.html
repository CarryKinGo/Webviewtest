<!doctype html>
<html><head><meta charset="utf-8"><title>bridge probe</title></head><body>
<pre id="log"></pre>
<script>
(function () {
  var log = document.getElementById("log");
  function L(s) { log.textContent += s + "\n"; }

  if (!window.dltLocalChannel || !window.dltLocalChannel.callBridgeApi) {
    L("FAIL: no dltLocalChannel (wrong WebView or bridge not injected)");
    return;
  }
  L("OK: dltLocalChannel present");

  function msg(methodName, args, callbackId) {
    return JSON.stringify({
      abilityName: "Api", renderId: "1", target: "native", source: "render",
      dataJson: {
        methodName: methodName,
        callbackId: callbackId,
        dataJson: JSON.stringify({ time: Date.now() }),
        args: JSON.stringify(args)
      },
      callbackId: callbackId,
      time: Date.now()
    });
  }

  window.onMessage = function (m) {
    L("onMessage cb=" + (m && m.callbackId) + " data=" + String(m && m.dataJson).slice(0, 500));
  };

  // 仅当前 mini-app 沙箱 temp_data，不涉及 ../ 穿越
  try {
    window.dltLocalChannel.callBridgeApi(msg(
      "fileWriteFile",
      { filePath: "probe_own.txt", data: "probe " + Date.now() + "\n", encoding: "utf-8" },
      "w_probe"
    ));
    L("sent fileWriteFile(probe_own.txt)");
  } catch (e) {
    L("callBridgeApi threw: " + e);
  }
})();
</script>
</body></html>
